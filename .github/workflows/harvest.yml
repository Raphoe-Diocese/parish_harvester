name: Harvest Parish Bulletins
run-name: Harvest ${{ inputs.target_parish || 'full' }}

on:
  schedule:
    # Sunday 09:00 UTC = 10:00 Irish summer time (IST, UTC+1).
    # A 4-hour full harvest then finishes around 14:00 Irish.
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      diocese:
        description: 'Diocese to harvest (or "all" for every diocese)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - clogher_diocese
          - derry_diocese
          - down_and_connor
          - raphoe_diocese
      target_parish:
        description: 'Parish key for instant single-parish rebuild (leave empty for full run)'
        required: false
        default: ''
        type: string
      run_tests:
        description: 'Run tests before harvesting (set false for emergency/manual runs)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  issues: write

# Full harvest and single-parish tests must not share one queue — otherwise
# "Send & test" waits 30–60+ min behind a running full harvest.
# Do not add a diocese matrix: one job writes report.json, parish_status.json,
# mega PDFs, and commits to main. Parallel diocese jobs would race on git push
# and overwrite shared status. Future (26 dioceses): one job per diocese writes
# its own artifact; a final stitch job builds megas + parish_status + pages.
concurrency:
  group: harvest-${{ github.event.inputs.target_parish || 'full' }}
  cancel-in-progress: ${{ github.event.inputs.target_parish != '' }}

jobs:
  harvest:
    runs-on: ubuntu-latest
    # Public-repo Actions minutes are free — allow slow parishes (up to ~15 min each).
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install pytest

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-py312

      - name: Install Playwright browsers
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Install LibreOffice (DOCX → PDF conversion)
        run: |
          set -euo pipefail
          # Several parishes (Down & Connor + Derry) publish bulletins as .docx,
          # never PDF (see harvester/fetcher.py:_download_docx_as_pdf). Without
          # a real LibreOffice binary this silently falls back to a text-only
          # python-docx+reportlab reconstruction that drops all images/layout
          # and is often small enough to be discarded by the tiny-PDF guard
          # (config.MIN_PDF_BYTES) — reporting a false "failed" for parishes
          # whose bulletin was genuinely available.
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libreoffice-writer ghostscript

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests == 'true'
        continue-on-error: true
        id: tests
        run: |
          set -euo pipefail
          pytest -v --tb=short

      - name: Note test failures (harvest continues)
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::warning::Tests failed — harvest will still run. Fix tests soon; see test.yml on push."

      - name: Autofix recipes before harvest
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.target_parish == ''
        run: |
          set -euo pipefail
          python scripts/autofix_recipes.py || true

      - name: Run Bulletin Harvester
        id: harvest_run
        run: |
          set -euo pipefail
          ARGS="--diocese ${{ github.event.inputs.diocese || 'all' }}"
          if [ -n "${{ github.event.inputs.target_parish }}" ]; then
            ARGS="$ARGS --target-parish ${{ github.event.inputs.target_parish }}"
          fi
          xvfb-run -a python main.py $ARGS
        env:
          HARVEST_MEGA_PDF: "1"
          HARVEST_EMAIL_TO: ${{ secrets.HARVEST_EMAIL_TO }}
          HARVEST_EMAIL_FROM: ${{ secrets.HARVEST_EMAIL_FROM }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Validate harvest outputs
        if: steps.harvest_run.outcome == 'success'
        run: |
          set -euo pipefail
          if [ ! -f Bulletins/report.json ]; then
            echo "Error: expected harvest output missing: Bulletins/report.json"
            exit 1
          fi
          if [ ! -f Bulletins/report.txt ]; then
            echo "Error: expected harvest output missing: Bulletins/report.txt"
            exit 1
          fi

      # Full harvests can start on an older SHA, then a viewer-chrome PR lands on
      # main while this job is still running. Re-render diocese HTML with the
      # latest templates so the docs snapshot / commit do not wipe parish
      # mastheads, 850px panels, or new-tab links. Does not touch mega PDFs.
      - name: Rebuild diocese pages from latest main templates
        if: steps.harvest_run.outcome == 'success' && github.event.inputs.target_parish == ''
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            ocr/bulletin_layout.py \
            ocr/generate_bulletin_pages.py \
            ocr/parish_pages.py \
            harvester/page_renderer.py \
            harvester/site_builder.py \
            harvester/site_chrome.py
          if [ ! -f Bulletins/report.json ]; then
            echo "No report.json — skip template refresh rebuild"
            exit 0
          fi
          python -c "from pathlib import Path; from harvester.site_builder import run; run(report_path=Path('Bulletins/report.json'), docs_dir=Path('docs'))"
          echo "Rebuilt docs/dioceses from origin/main viewer templates"

      - name: Upload mega PDF artifacts
        if: steps.harvest_run.outcome == 'success' && github.event.inputs.target_parish == ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: all-mega-bulletin-pdf
          path: mega_pdf/*_mega_bulletin.pdf
          if-no-files-found: warn
          retention-days: 30

      # Upload BEFORE commit — if git push fails later, OCR/deploy still get fresh outputs.
      - name: Upload Bulletins artifact
        if: steps.harvest_run.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bulletins-${{ github.run_id }}
          path: Bulletins/
          retention-days: 30

      - name: Upload dashboard artifact
        if: steps.harvest_run.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: harvest-dashboard-${{ github.run_id }}
          path: Bulletins/dashboard.html
          retention-days: 30

      - name: Upload harvest docs snapshot
        if: steps.harvest_run.outcome == 'success' && github.event.inputs.target_parish == ''
        uses: actions/upload-artifact@v4
        with:
          name: harvest-docs-${{ github.run_id }}
          path: |
            docs/dioceses/
            docs/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build training backlog
        if: always()
        run: |
          set -euo pipefail
          if [ -f Bulletins/report.json ]; then
            python scripts/build_training_backlog.py || true
          fi

      - name: Write workflow step summary
        if: always()
        env:
          TARGET_PARISH: ${{ github.event.inputs.target_parish }}
        run: |
          set -euo pipefail
          if [ -f Bulletins/report.json ]; then
            python - <<'PYEOF'
          import json, os
          d = json.load(open("Bulletins/report.json"))
          target = (os.environ.get("TARGET_PARISH") or "").strip().lower()
          lines = []

          if target:
              lines += [
                  f"## 🧪 Single-parish test: `{target}`",
                  "",
                  "_Only this parish was harvested. The full diocese was **not** re-run._",
                  "",
              ]
              found = None
              for section, icon in (
                  ("downloaded", "✅"),
                  ("html_links", "🔗"),
                  ("failed", "❌"),
                  ("skipped", "⏭️"),
                  ("stale_rejected", "🕐"),
              ):
                  for item in d.get(section) or []:
                      if (item.get("parish") or "").lower() == target:
                          found = (section, icon, item)
                          break
                  if found:
                      break
              if found:
                  section, icon, item = found
                  name = item.get("display_name") or target
                  if section == "downloaded":
                      lines.append(f"| Result | {icon} **Downloaded** — `{item.get('file', '?')}` |")
                  elif section == "html_links":
                      lines.append(f"| Result | {icon} **HTML link** — {item.get('url', '?')} |")
                  elif section == "failed":
                      err = (item.get("error") or "?")[:200]
                      lines.append(f"| Result | {icon} **Failed** — _{err}_ |")
                  elif section == "skipped":
                      lines.append(f"| Result | {icon} **Skipped** — _{item.get('reason', '?')}_ |")
                  else:
                      lines.append(f"| Result | {icon} **Stale rejected** — _{item.get('reason', '?')}_ |")
                  lines.append(f"| Parish | **{name}** |")
              else:
                  lines.append("| Result | ⚠️ **Not found in report** — run may have been cancelled before harvest finished. |")
              lines.append("")
          else:
              s = d.get("summary", {})
              dl = s.get("downloaded", 0)
              hl = s.get("html_links", 0)
              fa = s.get("failed", 0)
              total = dl + fa
              rate = f"{dl/total*100:.1f}%" if total > 0 else "N/A"
              lines += [
                  f"## 📋 Bulletin Harvest — {d.get('target_date','?')}",
                  "",
                  f"| Metric | Value |",
                  f"|--------|-------|",
                  f"| ✅ Downloaded | {dl} |",
                  f"| 🔗 HTML links | {hl} |",
                  f"| 💥 Failed | {fa} |",
                  f"| 📈 Success rate | {rate} |",
                  "",
              ]
              if d.get("failed"):
                  lines += ["### ❌ Failed parishes (need re-training)", ""]
                  for f in d["failed"]:
                      lines.append(f"- **{f['display_name']}** — _{f.get('error','?')[:120]}_")
                  lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines))
          PYEOF
          fi
          if [ ! -f Bulletins/report.json ]; then
            echo "## ❌ Bulletin Harvest failed before report generation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Expected \`Bulletins/report.json\` was not created." >> "$GITHUB_STEP_SUMMARY"
            echo "See failed logs in run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post GitHub Issue summary
        if: steps.harvest_run.outcome == 'success' && github.event.inputs.target_parish == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f Bulletins/report.json ]; then
            DIOCESE="${{ github.event.inputs.diocese || 'all' }}"
            REPORT_DATE=$(python -c "import json; d=json.load(open('Bulletins/report.json')); print(d.get('target_date','unknown'))")
            REPORT_DATE_UK=$(python -c "import json; d=json.load(open('Bulletins/report.json')); v=d.get('target_date','unknown'); parts=v.split('-'); print('/'.join([parts[2],parts[1],parts[0]]) if len(parts)==3 else v)")
            DOWNLOADED=$(python -c "import json; d=json.load(open('Bulletins/report.json')); print(d['summary']['downloaded'])")
            HTML_LINKS=$(python -c "import json; d=json.load(open('Bulletins/report.json')); print(d['summary']['html_links'])")
            FAILED=$(python -c "import json; d=json.load(open('Bulletins/report.json')); print(d['summary']['failed'])")
            FAILED_LIST=$(python -c "
          import json
          d = json.load(open('Bulletins/report.json'))
          ffs = d.get('failed', [])
          if ffs:
              lines = []
              for f in ffs:
                  lines.append('- **' + f['display_name'] + '** (' + f.get('url','') + ')  ')
                  lines.append('  _Reason: ' + f.get('error','unknown') + '_')
              print('\n'.join(lines))
          else:
              print('_None_ \U0001f389')
          ")
            HTML_LIST=$(python -c "
          import json
          d = json.load(open('Bulletins/report.json'))
          hls = d.get('html_links', [])
          if hls:
              print('\n'.join('- **' + h['display_name'] + '**: [' + h['url'] + '](' + h['url'] + ')' for h in hls))
          else:
              print('_None_')
          ")
            BODY="## 📋 Bulletin Harvest Report — ${DIOCESE} — ${REPORT_DATE_UK}

          **Diocese:** \`${DIOCESE}\`

          | Category | Count |
          |----------|-------|
          | ✅ Downloaded | ${DOWNLOADED} |
          | 🔗 HTML links | ${HTML_LINKS} |
          | 💥 Failed | ${FAILED} |

          ### Failed Parishes

          ${FAILED_LIST}

          ### HTML-Only Parishes (links in mega PDF)

          ${HTML_LIST}

          [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

            ISSUE_TITLE="📋 Bulletin Harvest Report — ${DIOCESE} — ${REPORT_DATE_UK}"

            # Close superseded open reports for this same diocese only
            gh issue list \
              --state open \
              --json number,title \
              --limit 100 \
              --jq ".[] | select(.title | startswith(\"📋 Bulletin Harvest Report — ${DIOCESE} — \")) | select(.title != \"${ISSUE_TITLE}\") | .number" \
              | xargs -r -I{} gh issue close {} --comment "Superseded by newer harvest report." || true

            # Find existing open issue with exactly today's diocese+date title
            EXISTING_ISSUE=$(gh issue list \
              --state open \
              --json number,title \
              --limit 100 \
              --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" \
              | head -n 1)

            if [ -n "${EXISTING_ISSUE}" ]; then
              echo "Updating existing issue #${EXISTING_ISSUE}"
              gh issue edit "${EXISTING_ISSUE}" --body "${BODY}"
            else
              echo "Creating new issue"
              gh issue create \
                --title "${ISSUE_TITLE}" \
                --body "${BODY}" \
                --label "harvest-report" 2>/dev/null || \
              gh issue create \
                --title "${ISSUE_TITLE}" \
                --body "${BODY}" || true
            fi
          fi

      - name: Commit bulletins back to repo
        if: steps.harvest_run.outcome == 'success'
        id: commit_harvest
        run: |
          set -euo pipefail
          if [ ! -f Bulletins/report.json ]; then
            echo "Error: harvest finished but Bulletins/report.json is missing — nothing to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Partial harvests are normal — always commit OK parishes + parish_status for the extension.
          git add -f Bulletins/report.json Bulletins/report.txt Bulletins/dashboard.html docs/manifest.json docs/index.html docs/dioceses/ 2>/dev/null || true
          git add -f Bulletins/current/*.pdf 2>/dev/null || true
          git add -f Bulletins/stale/*.pdf 2>/dev/null || true
          git add -f mega_pdf/*_mega_bulletin.pdf 2>/dev/null || true
          git add -f docs/mega_pdf/*_mega_bulletin.pdf docs/mega_pdf/*.pages.json 2>/dev/null || true
          git add -f parishes/consecutive_failures.json parishes/stale_bulletins.json parishes/retry_queue.json parishes/parish_status.json parishes/training_backlog.json 2>/dev/null || true
          TARGET_PARISH="${{ github.event.inputs.target_parish }}"
          if [ -n "${TARGET_PARISH}" ] && [ -f "Bulletins/current/${TARGET_PARISH}.pdf" ]; then
            git add -f "Bulletins/current/${TARGET_PARISH}.pdf"
            echo "Including test PDF: Bulletins/current/${TARGET_PARISH}.pdf"
          fi
          if [ -n "${TARGET_PARISH}" ] && [ -f "Bulletins/stale/${TARGET_PARISH}.pdf" ]; then
            git add -f "Bulletins/stale/${TARGET_PARISH}.pdf"
            echo "Including stale PDF: Bulletins/stale/${TARGET_PARISH}.pdf"
          fi
          # Current-week proof copies at Bulletins/<key>.pdf — never zip archives.
          if [ -n "${TARGET_PARISH}" ] && [ -f "Bulletins/${TARGET_PARISH}.pdf" ]; then
            git add -f "Bulletins/${TARGET_PARISH}.pdf"
            echo "Including proof PDF: Bulletins/${TARGET_PARISH}.pdf"
          fi
          shopt -s nullglob
          for proof in Bulletins/*.pdf; do
            case "$(basename "$proof")" in
              all_bulletins_*) ;;
              *) git add -f "$proof" ;;
            esac
          done
          if git diff --cached --quiet; then
            echo "ℹ️  No staged changes — skipping commit."
            exit 0
          fi
          git commit -m "chore: add harvested bulletins for $(date +%Y-%m-%d) [skip ci]"
          # Generated harvest outputs (mega PDFs, diocese pages, report/status)
          # cannot always merge. On add/add or content conflict during rebase,
          # keep the files this harvest just generated and continue.
          python scripts/push_harvest_results.py --remote origin --branch main

      - name: Warn if git commit failed
        if: failure() && steps.harvest_run.outcome == 'success' && steps.commit_harvest.outcome == 'failure'
        run: |
          echo "::error::Harvest finished OK but could not push to main — mega PDF and report artifacts were still uploaded for OCR/Pages deploy. This run is now marked failed so it doesn't go unnoticed."

      - name: Update cost dashboard
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -c "
          from pathlib import Path
          from harvester.cost_tracker import update_dashboard
          update_dashboard(Path('.'))
          " || echo "⚠️  Cost dashboard update failed — harvest continues."
