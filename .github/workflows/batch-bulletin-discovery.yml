name: Batch parish bulletin discovery

# Research queue includes 456 deduplicated leads; unresolved sources are prioritised.
on:
  schedule:
    - cron: '15 2,8,14,20 * * *'
  push:
    branches: [main]
    paths:
      - '.github/batch-discovery-now.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-bulletin-discovery
  cancel-in-progress: false

jobs:
  batch-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialise persistent scanner run status
        run: |
          mkdir -p docs/discovery _batch_diagnostics
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          Path("docs/discovery/batch-probe-run-status.json").write_text(
              json.dumps({
                  "status": "started",
                  "utc_started_at": datetime.now(timezone.utc).isoformat(),
                  "workflow": "batch-bulletin-discovery",
                  "result_path": "docs/discovery/batch-bulletin-probes.json",
              }, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt

      - name: Verify probe safety (preserve results even if tests fail)
        id: probe_tests
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p _batch_diagnostics
          python -m py_compile scripts/batch_bulletin_probe.py 2>&1 | tee _batch_diagnostics/compile.log
          python -m unittest discover -s tests -p test_batch_bulletin_probe.py -v 2>&1 | tee _batch_diagnostics/tests.log

      - name: Probe 120 unresolved sources in parallel
        id: probe_run
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p _batch_diagnostics
          python scripts/batch_bulletin_probe.py --limit 120 --workers 16 2>&1 | tee _batch_diagnostics/scan.log

      - name: Record scanner result status
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.probe_tests.outcome }}
          SCAN_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path("docs/discovery/batch-probe-run-status.json")
          original = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          results = Path("docs/discovery/batch-bulletin-probes.json")
          outcome = os.environ.get("SCAN_OUTCOME", "unknown")
          tests = os.environ.get("TEST_OUTCOME", "unknown")
          original.update({
              "status": "completed" if outcome == "success" and tests == "success" else "failed",
              "utc_finished_at": datetime.now(timezone.utc).isoformat(),
              "tests": os.environ.get("TEST_OUTCOME", "unknown"),
              "scan": outcome,
              "results_file_exists": results.exists(),
          })
          path.write_text(json.dumps(original, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Preserve results and diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-bulletin-probes-${{ github.run_id }}
          path: |
            docs/discovery/batch-bulletin-probes.json
            docs/discovery/batch-probe-run-status.json
            parishes/batch_probe_cursor.json
            _batch_diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit cursor, results and persistent run status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/discovery/batch-probe-run-status.json
          git add docs/discovery/batch-bulletin-probes.json parishes/batch_probe_cursor.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "discovery: inspect unresolved bulletin sources in batches [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Surface failed tests and scan as a red workflow
        if: always()
        run: |
          if [ "${{ steps.probe_tests.outcome }}" = "failure" ] || [ "${{ steps.probe_run.outcome }}" = "failure" ]; then
            echo "::error::Batch discovery failed a check. Diagnostics were preserved in the workflow artefact."
            exit 1
          fi
