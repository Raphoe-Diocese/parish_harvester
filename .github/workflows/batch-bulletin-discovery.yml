name: Batch parish bulletin discovery

# Research queue includes 456 deduplicated leads; unresolved sources are prioritised.
on:
  schedule:
    - cron: '15 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-bulletin-discovery
  cancel-in-progress: false

jobs:
  batch-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe 120 unresolved sources in parallel
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/batch_bulletin_probe.py --limit 120 --workers 16

      - name: Preserve machine-readable result
        uses: actions/upload-artifact@v4
        with:
          name: batch-bulletin-probes-${{ github.run_id }}
          path: docs/discovery/batch-bulletin-probes.json
          retention-days: 30

      - name: Commit cursor and results, retry concurrent harvest pushes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/discovery/batch-bulletin-probes.json parishes/batch_probe_cursor.json
          git diff --cached --quiet && exit 0
          git commit -m "discovery: inspect unresolved bulletin sources in batches [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
