name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check extension and viewer JavaScript
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(extension/*.js docs/assets/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No JS files matched extension/*.js or docs/assets/*.js"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check ${f}"
            node --check "${f}"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v --tb=short
