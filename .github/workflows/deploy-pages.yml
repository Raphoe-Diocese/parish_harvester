name: Deploy Parish Press to GitHub Pages
# Publishes docs/ (diocese pages, OCR archive, search) on every deploy.
# Mega PDFs are included when available; missing PDFs must not block the static site.

on:
  workflow_run:
    workflows:
      - "Harvest Parish Bulletins"
      - "Generate OCR bulletin viewers"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - docs/**
      - mega_pdf/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mega PDF artifacts from harvest run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Harvest Parish Bulletins'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: "*-mega-bulletin-pdf"
          path: _harvest_artifacts
          merge-multiple: true

      - name: Download harvest docs snapshot from harvest run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Harvest Parish Bulletins'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: "harvest-docs-*"
          path: _harvest_docs
          merge-multiple: true

      - name: Download OCR docs snapshot from OCR run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Generate OCR bulletin viewers'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: "ocr-docs-*"
          path: _ocr_docs
          merge-multiple: true

      - name: Apply workflow docs snapshots to checkout
        run: |
          set -euo pipefail
          applied=false
          if [ -d _harvest_docs/docs/dioceses ]; then
            mkdir -p docs/dioceses
            cp -a _harvest_docs/docs/dioceses/. docs/dioceses/
            echo "Applied harvest docs/dioceses snapshot"
            applied=true
          fi
          if [ -f _harvest_docs/docs/manifest.json ]; then
            cp _harvest_docs/docs/manifest.json docs/manifest.json
            echo "Applied harvest docs/manifest.json"
            applied=true
          fi
          if [ -d _ocr_docs/docs/bulletins ]; then
            mkdir -p docs/bulletins
            cp -a _ocr_docs/docs/bulletins/. docs/bulletins/
            echo "Applied OCR docs/bulletins snapshot"
            applied=true
          fi
          if [ -d _ocr_docs/docs/dioceses ]; then
            mkdir -p docs/dioceses
            cp -a _ocr_docs/docs/dioceses/. docs/dioceses/
            echo "Applied OCR docs/dioceses snapshot"
            applied=true
          fi
          if [ "${applied}" = "false" ]; then
            echo "No workflow docs snapshots to apply — using git checkout docs/"
          fi

      # Single-parish harvests have no mega artifacts. If we skip this fallback,
      # Pages replaces the whole site and /mega_pdf/*.pdf 404s. Always recover
      # the latest harvest that actually uploaded *_mega_bulletin.pdf.
      - name: Download mega PDFs from latest harvest (OCR/docs-only deploys)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _harvest_artifacts
          if find _harvest_artifacts -type f -name '*_mega_bulletin.pdf' | grep -q .; then
            echo "Mega PDFs already present from the triggering harvest run"
            exit 0
          fi
          FOUND=""
          while IFS= read -r run_id; do
            [ -n "${run_id}" ] || continue
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.name | test("mega-bulletin-pdf"; "i") and .expired == false)] | length')"
            if [ "${count:-0}" -gt 0 ]; then
              echo "Downloading mega PDF artifact from harvest run ${run_id}"
              gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name all-mega-bulletin-pdf --dir _harvest_artifacts || \
                gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --dir _harvest_artifacts
              FOUND="yes"
              break
            fi
          done < <(gh run list --repo "${GITHUB_REPOSITORY}" --workflow harvest.yml --limit 80 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | .databaseId')
          if [ -z "${FOUND}" ]; then
            echo "::warning::No harvest run with mega PDF artifacts found — Pages deploy may omit mega PDFs."
          fi

      - name: Verify mega PDFs for Pages deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          HARVEST_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
        run: |
          set -euo pipefail
          mkdir -p mega_pdf
          HAD_NEW_ARTIFACTS=false

          if [ -d _harvest_artifacts ]; then
            while IFS= read -r -d '' pdf; do
              dest="mega_pdf/$(basename "${pdf}")"
              cp "${pdf}" "${dest}"
              HAD_NEW_ARTIFACTS=true
            done < <(find _harvest_artifacts -type f -name '*_mega_bulletin.pdf' -print0)
          fi

          if [ -d docs/mega_pdf ]; then
            while IFS= read -r -d '' pdf; do
              dest="mega_pdf/$(basename "${pdf}")"
              if [ ! -e "${dest}" ]; then
                cp "${pdf}" "${dest}"
              fi
            done < <(find docs/mega_pdf -maxdepth 1 -type f -name '*_mega_bulletin.pdf' -print0 2>/dev/null || true)
          fi

          shopt -s nullglob
          pdfs=(mega_pdf/*_mega_bulletin.pdf)
          if [ "${EVENT_NAME}" = "workflow_run" ] && [ "${TRIGGERING_WORKFLOW}" = "Harvest Parish Bulletins" ] && [ ${#pdfs[@]} -eq 0 ]; then
            echo "::warning::No mega PDF artifacts from harvest run ${WORKFLOW_RUN_ID:-unknown} (conclusion: ${HARVEST_CONCLUSION:-n/a}) — deploying diocese pages without fresh mega PDFs."
          elif [ "${#pdfs[@]}" -gt 0 ]; then
            echo "Mega PDFs staged for Pages:"
            for pdf in "${pdfs[@]}"; do
              if [ ! -s "${pdf}" ]; then
                echo "Error: mega PDF is missing or empty: ${pdf}"
                exit 1
              fi
              if ! python3 -c "import sys; sig=open(sys.argv[1],'rb').read(5); sys.exit(0 if sig==b'%PDF-' else 1)" "${pdf}"; then
                echo "Error: file does not look like a PDF: ${pdf}"
                exit 1
              fi
              ls -lh "${pdf}"
            done
          fi

          echo "HAD_NEW_ARTIFACTS=${HAD_NEW_ARTIFACTS}" >> "$GITHUB_ENV"

      - name: Build Pages site (mega PDFs + extension updates)
        env:
          CHROME_EXTENSION_APP_ID: ${{ vars.CHROME_EXTENSION_APP_ID }}
        run: |
          set -euo pipefail
          if [ ! -f docs/index.html ]; then
            echo "Error: docs/index.html is missing — cannot deploy Parish Press."
            exit 1
          fi

          rm -rf _site
          mkdir -p _site
          cp -a docs/. _site/

          shopt -s nullglob
          pdfs=(mega_pdf/*_mega_bulletin.pdf)
          if [ ${#pdfs[@]} -gt 0 ]; then
            mkdir -p _site/mega_pdf
            cp -a mega_pdf/. _site/mega_pdf/
          fi

          mkdir -p _site/extension
          zip -qr _site/extension/parish_trainer.zip extension
          if [ ! -s _site/extension/parish_trainer.zip ]; then
            echo "Error: extension package was not generated or is empty."
            exit 1
          fi

          VERSION=$(python3 -c "import json,pathlib; m=json.loads(pathlib.Path('extension/manifest.json').read_text()); print(m.get('version','0.0.0'))")
          PREV_VERSION="unknown"
          MANIFEST_BUMPED="false"
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            PREV_VERSION=$(python3 -c "import json,subprocess; r=subprocess.run(['git','show','HEAD^:extension/manifest.json'],capture_output=True,text=True); print(json.loads(r.stdout).get('version','unknown') if r.returncode==0 and r.stdout.strip() else 'unknown')" 2>/dev/null || echo "unknown")
            if git diff --name-only HEAD^ HEAD | grep -qx 'extension/manifest.json'; then
              MANIFEST_BUMPED="true"
            fi
          fi

          if [ -z "${CHROME_EXTENSION_APP_ID:-}" ]; then
            echo "Warning: CHROME_EXTENSION_APP_ID not set, using placeholder." >&2
            APP_ID="REPLACE_WITH_EXTENSION_ID"
          else
            APP_ID="${CHROME_EXTENSION_APP_ID}"
          fi

          PAGES_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

          python3 -c "import sys; a,b,v=sys.argv[1],sys.argv[2],sys.argv[3]; open('_site/updates.xml','w').write('<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<gupdate xmlns=\"http://www.google.com/update2/response\" protocol=\"2.0\">\n  <app appid=\"'+a+'\">\n    <updatecheck codebase=\"'+b+'/extension/parish_trainer.zip\" version=\"'+v+'\" />\n  </app>\n</gupdate>\n')" "${APP_ID}" "${PAGES_BASE}" "${VERSION}"

          if ! grep -Fq "version=\"${VERSION}\"" _site/updates.xml; then
            echo "Error: generated updates.xml does not contain extension version ${VERSION}."
            exit 1
          fi

          {
            echo "EXTENSION_PREV_VERSION=${PREV_VERSION}"
            echo "EXTENSION_NEW_VERSION=${VERSION}"
            echo "EXTENSION_MANIFEST_BUMPED=${MANIFEST_BUMPED}"
            echo "EXTENSION_PACKAGE_URL=${PAGES_BASE}/extension/parish_trainer.zip"
            echo "EXTENSION_UPDATES_URL=${PAGES_BASE}/updates.xml"
            echo "PAGES_BASE_URL=${PAGES_BASE}"
          } >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish deploy summary
        run: |
          set -euo pipefail
          {
            echo "## Parish Press Pages deploy"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Site home | ${PAGES_BASE_URL:-not-set}/ |"
            echo "| Derry diocese | ${PAGES_BASE_URL:-not-set}/dioceses/derry/ |"
            echo "| Down and Connor | ${PAGES_BASE_URL:-not-set}/dioceses/down-and-connor/ |"
            echo "| Raphoe diocese | ${PAGES_BASE_URL:-not-set}/dioceses/raphoe/ |"
            echo "| OCR archive | ${PAGES_BASE_URL:-not-set}/bulletins/ |"
            echo "| Extension package | ${EXTENSION_PACKAGE_URL:-not-set} |"
            echo "| Extension updates | ${EXTENSION_UPDATES_URL:-not-set} |"
            echo "| Deployed Pages URL | ${{ steps.deployment.outputs.page_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean mega PDFs from repository after deploy
        if: github.event_name == 'workflow_run' && env.HAD_NEW_ARTIFACTS == 'true'
        continue-on-error: true
        id: cleanup_repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p mega_pdf Bulletins/current docs/mega_pdf
          find mega_pdf -maxdepth 1 -type f -name '*.pdf' -delete || true
          find docs/mega_pdf -maxdepth 1 -type f -name '*.pdf' -delete || true
          find Bulletins/current -maxdepth 1 -type f -name '*.pdf' -delete || true
          find Bulletins -maxdepth 1 -type f -name 'all_bulletins_*.pdf' -delete || true
          touch mega_pdf/.gitkeep docs/mega_pdf/.gitkeep Bulletins/current/.gitkeep
          shopt -s nullglob
          pdfs=(Bulletins/all_bulletins_*.pdf)
          if [ ${#pdfs[@]} -gt 0 ]; then
            git add -A mega_pdf docs/mega_pdf Bulletins/current "${pdfs[@]}"
          else
            git add -A mega_pdf docs/mega_pdf Bulletins/current
          fi
          if git diff --cached --quiet; then
            echo "No staged cleanup changes — skipping commit."
            exit 0
          fi
          git commit -m "chore: clean deployed PDFs [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Cleanup pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Cleanup push attempt ${attempt} failed; pulling --rebase and retrying…"
            git pull --rebase origin main || {
              echo "Rebase failed during cleanup; aborting."
              git rebase --abort || true
              exit 1
            }
          done
          echo "Could not push cleanup commit after 5 attempts."
          exit 1

      - name: Warn if repo cleanup push failed
        if: steps.cleanup_repo.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy succeeded but could not push PDF cleanup commit to main."
