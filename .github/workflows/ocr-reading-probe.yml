name: OCR reading probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ocr-reading-probe.yml
      - scripts/ocr_reading_probe.py
      - ocr/reading_check.py
      - ocr/convert_bulletin.py
      - ocr/sparse_page_ocr.py
      - ocr/text_extract.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this ref
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ocr.txt

      - name: Install poppler
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-ocr.txt

      - name: Score Annagry, Gortahork, and Newtown PDFs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ocr_reading_probe.py

      - name: Upload reading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-reading-probe
          path: ocr-reading-probe.txt
          if-no-files-found: warn
