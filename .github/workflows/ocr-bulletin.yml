name: Generate OCR bulletin viewers

on:
  workflow_run:
    workflows: ["Harvest Parish Bulletins"]
    types:
      - completed
  # Fallback if workflow_run does not fire: Sunday 13:00 UTC (14:00 Irish).
  # Primary trigger is workflow_run after a full harvest finishes.
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  generate-ocr-viewers:
    # After any successful harvest that is not a single-parish Send & test.
    # One-diocese runs (Harvest raphoe_diocese) must refresh OCR too — otherwise
    # parishpress keeps last week's mega text (08/10/2026 Ardara/Attymass).
    # Artifact check below still skips runs with no mega PDF.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'schedule' ||
        contains(github.event.workflow_run.display_title, '_diocese') ||
        github.event.workflow_run.display_title == 'Harvest all' ||
        github.event.workflow_run.display_title == 'Harvest full' ||
        github.event.workflow_run.display_title == 'Harvest sunday-all-dioceses'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-ocr.txt

      - name: Install poppler
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-gle

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt -r requirements-ocr.txt

      - name: Resolve harvest run for mega PDF artifacts
        id: harvest_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          has_mega_artifact() {
            local run_id="$1"
            local count
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.name | test("mega-bulletin-pdf"; "i")) | select(.expired == false)] | length')"
            [ "${count:-0}" -gt 0 ]
          }
          pick_run_with_mega_artifact() {
            local run_id=""
            while IFS= read -r candidate; do
              [ -n "${candidate}" ] || continue
              if has_mega_artifact "${candidate}"; then
                run_id="${candidate}"
                break
              fi
            done < <(gh run list --repo "${GITHUB_REPOSITORY}" --workflow harvest.yml --branch main --limit 25 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId')
            echo "${run_id}"
          }

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            if has_mega_artifact "${RUN_ID}"; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "Using harvest workflow run ${RUN_ID} (has mega PDF artifact)"
            else
              echo "::error::Harvest run ${RUN_ID} has no usable mega PDF artefact. Existing viewers were kept."
              exit 1
            fi
          else
            RUN_ID="$(pick_run_with_mega_artifact)"
            if [ -n "${RUN_ID}" ]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "Manual OCR run — using harvest run ${RUN_ID} (has mega PDF artifact)"
            else
              echo "::error::No successful main harvest with a usable mega PDF artefact."
              exit 1
            fi
          fi

      - name: Download mega PDF artifacts from harvest run
        uses: actions/download-artifact@v4.1.3
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.harvest_run.outputs.run_id }}
          pattern: "*-mega-bulletin-pdf"
          path: /tmp/ocr-bulletins/raw
          merge-multiple: true

      - name: Download harvest report for site rebuild
        uses: actions/download-artifact@v4.1.3
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.harvest_run.outputs.run_id }}
          pattern: "bulletins-*"
          path: _harvest_bulletins
          merge-multiple: true

      - name: Download harvest docs snapshot
        continue-on-error: true
        uses: actions/download-artifact@v4.1.3
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.harvest_run.outputs.run_id }}
          pattern: "harvest-docs-*"
          path: _harvest_docs
          merge-multiple: true

      - name: Apply harvest docs snapshot
        run: |
          set -euo pipefail
          if [ -d _harvest_docs/docs/dioceses ]; then
            mkdir -p docs/dioceses
            cp -a _harvest_docs/docs/dioceses/. docs/dioceses/
            echo "Applied harvest docs/dioceses snapshot"
          fi
          if [ -f _harvest_docs/docs/manifest.json ]; then
            cp _harvest_docs/docs/manifest.json docs/manifest.json
            echo "Applied harvest docs/manifest.json"
          fi

      - name: Validate and stage the current harvest PDF and page index
        id: stage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Europe/Dublin")).date()
          week = today - timedelta(days=(today.weekday() + 1) % 7)
          report_path = Path("_harvest_bulletins/report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if date.fromisoformat(report["target_date"]) != week:
              raise SystemExit(f"::error::Expected harvest week {week}, got {report['target_date']}.")

          raw = Path("/tmp/ocr-bulletins/raw")
          staged = Path("/tmp/ocr-bulletins/staged")
          staged.mkdir(parents=True, exist_ok=True)
          pdfs = sorted(raw.glob("*_mega_bulletin.pdf"))
          if not pdfs:
              raise SystemExit("::error::No mega PDFs in the selected harvest artefact.")

          for pdf in pdfs:
              index = pdf.with_suffix(".pages.json")
              if not index.is_file():
                  raise SystemExit(f"::error::No page index in the harvest artefact for {pdf.name}.")
              metadata = json.loads(index.read_text(encoding="utf-8"))
              if metadata.get("date") != week.isoformat() or metadata.get("pdf") != pdf.name:
                  raise SystemExit(f"::error::Wrong week or PDF name in {index.name}.")
              with pdf.open("rb") as source:
                  if source.read(5) != b"%PDF-":
                      raise SystemExit(f"::error::Invalid PDF signature in {pdf.name}.")
              shutil.copy2(pdf, staged / pdf.name)
              shutil.copy2(index, staged / index.name)

          Path("Bulletins").mkdir(exist_ok=True)
          shutil.copy2(report_path, "Bulletins/report.json")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"week={week}", file=output)
          print(f"Staged {len(pdfs)} PDF and page-index pairs for {week}.")
          PY

      - name: Generate OCR viewer pages
        id: ocr_generate
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          WEEK="${{ steps.stage.outputs.week }}"
          mkdir -p docs/mega_pdf
          STAGED="/tmp/ocr-bulletins/staged"
          PROCESSED=0
          FAILURES=0
          for diocese in $(python -c "import json;print(' '.join(d['key'] for d in json.load(open('parishes/dioceses.json'))['dioceses']))"); do
            pdf_path="${STAGED}/${diocese}_mega_bulletin.pdf"
            if [ ! -f "${pdf_path}" ]; then
              echo "Warning: PDF not found for ${diocese}, skipping"
              continue
            fi
            index_path="${pdf_path%.pdf}.pages.json"
            cp "${pdf_path}" "${index_path}" docs/mega_pdf/
            workdir="/tmp/ocr-bulletins/${diocese}"
            mkdir -p "${workdir}"
            ocr_html="${workdir}/bulletin-${WEEK}.html"
            echo "=== OCR ${diocese} ==="
            if ! (
              cd "${workdir}"
              python "${GITHUB_WORKSPACE}/ocr/convert_bulletin.py" "${pdf_path}" "${WEEK}"
            ); then
              echo "::error::convert_bulletin failed for ${diocese}"
              FAILURES=$((FAILURES + 1))
              continue
            fi
            if ! python ocr/generate_bulletin_pages.py \
              --diocese "${diocese}" \
              --date "${WEEK}" \
              --pdf "${pdf_path}" \
              --ocr-html "${ocr_html}"; then
              echo "::warning::generate_bulletin_pages failed for ${diocese}"
              FAILURES=$((FAILURES + 1))
              continue
            fi
            PROCESSED=$((PROCESSED + 1))
            echo "OK: ${diocese}"
          done
          echo "processed=${PROCESSED}" >> "$GITHUB_OUTPUT"
          if [ "${PROCESSED}" -eq 0 ]; then
            echo "::error::OCR produced no diocese viewers — check API keys and harvest PDF artifacts."
            exit 1
          fi
          if [ "${FAILURES}" -gt 0 ]; then
            echo "::error::OCR failed for ${FAILURES} diocese(s). Existing viewers were kept."
            exit 1
          fi

      - name: Update OCR quota dashboard
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          from pathlib import Path
          from harvester.cost_tracker import update_dashboard
          update_dashboard(Path('.'))
          " || echo "Cost dashboard update failed — OCR continues."

      - name: Rebuild diocese pages (embed OCR on Raphoe page)
        if: steps.ocr_generate.outputs.processed != '0'
        run: |
          set -euo pipefail
          if [ ! -f Bulletins/report.json ]; then
            echo "Warning: Bulletins/report.json missing — skipping site rebuild"
            exit 0
          fi
          python -c "from pathlib import Path; from harvester.site_builder import run; run(report_path=Path('Bulletins/report.json'), docs_dir=Path('docs'))"
          echo "Rebuilt docs/dioceses/*/index.html with latest OCR content"

      - name: Upload OCR docs snapshot
        if: steps.ocr_generate.outputs.processed != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ocr-docs-${{ github.run_id }}
          path: |
            docs/bulletins/
            docs/dioceses/
            docs/parishes/
            docs/mega_pdf/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated bulletin pages
        if: steps.ocr_generate.outputs.processed != '0'
        id: commit_ocr
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs Bulletins
          git add -f docs/mega_pdf/*_mega_bulletin.pdf docs/mega_pdf/*_mega_bulletin_p1.jpg docs/mega_pdf/*.pages.json docs/parishes 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::warning::OCR ran but nothing changed in docs/ — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update OCR bulletin viewers for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ OCR pushed on attempt ${attempt}"
              exit 0
            fi
            echo "⚠️  OCR push attempt ${attempt} failed; fetching and rebasing (autostash)…"
            git fetch origin main
            git rebase --autostash origin/main || {
              echo "❌ OCR rebase failed; aborting."
              git rebase --abort || true
              exit 1
            }
          done
          echo "❌ Could not push OCR after 5 attempts."
          exit 1

      - name: Warn if OCR git commit failed
        if: failure() && steps.ocr_generate.outputs.processed != '0'
        run: |
          echo "::warning::OCR viewers were generated but could not push to main — ocr-docs artifact was uploaded for Pages deploy."
