name: Generate OCR bulletin viewers

on:
  workflow_run:
    workflows: ["Harvest Parish Bulletins"]
    types:
      - completed
  # Fallback if workflow_run does not fire: Sunday 13:00 UTC (14:00 Irish).
  # Primary trigger is workflow_run after a full harvest finishes.
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  generate-ocr-viewers:
    # Full harvests only (run-name "Harvest full"). Skip single-parish
    # Send & test runs — those do not upload mega PDFs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.display_title == 'Harvest full'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-ocr.txt

      - name: Install poppler
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-gle

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt -r requirements-ocr.txt

      - name: Resolve harvest run for mega PDF artifacts
        id: harvest_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          has_mega_artifact() {
            local run_id="$1"
            local count
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.name | test("mega-bulletin-pdf"; "i"))] | length')"
            [ "${count:-0}" -gt 0 ]
          }
          pick_run_with_mega_artifact() {
            local run_id=""
            while IFS= read -r candidate; do
              [ -n "${candidate}" ] || continue
              if has_mega_artifact "${candidate}"; then
                run_id="${candidate}"
                break
              fi
            done < <(gh run list --repo "${GITHUB_REPOSITORY}" --workflow harvest.yml --limit 25 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | .databaseId')
            echo "${run_id}"
          }

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            if has_mega_artifact "${RUN_ID}"; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "Using harvest workflow run ${RUN_ID} (has mega PDF artifact)"
            else
              echo "run_id=none" >> "$GITHUB_OUTPUT"
              echo "Harvest run ${RUN_ID} has no mega PDF artifact — will use GitHub Pages fallback"
            fi
          else
            RUN_ID="$(pick_run_with_mega_artifact)"
            if [ -n "${RUN_ID}" ]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "Manual OCR run — using harvest run ${RUN_ID} (has mega PDF artifact)"
            else
              echo "run_id=none" >> "$GITHUB_OUTPUT"
              echo "No harvest run with mega PDF artifacts — will use GitHub Pages fallback"
            fi
          fi

      - name: Download mega PDF artifacts from harvest run
        if: steps.harvest_run.outputs.run_id != 'none'
        continue-on-error: true
        uses: actions/download-artifact@v4.1.3
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.harvest_run.outputs.run_id }}
          pattern: "*-mega-bulletin-pdf"
          path: /tmp/ocr-bulletins/raw
          merge-multiple: true

      - name: Download harvest report for site rebuild
        if: steps.harvest_run.outputs.run_id != 'none'
        continue-on-error: true
        uses: actions/download-artifact@v4.1.3
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.harvest_run.outputs.run_id }}
          pattern: "bulletins-*"
          path: Bulletins
          merge-multiple: true

      - name: Download harvest docs snapshot
        if: steps.harvest_run.outputs.run_id != 'none'
        continue-on-error: true
        uses: actions/download-artifact@v4.1.3
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.harvest_run.outputs.run_id }}
          pattern: "harvest-docs-*"
          path: _harvest_docs
          merge-multiple: true

      - name: Apply harvest docs snapshot
        run: |
          set -euo pipefail
          if [ -d _harvest_docs/docs/dioceses ]; then
            mkdir -p docs/dioceses
            cp -a _harvest_docs/docs/dioceses/. docs/dioceses/
            echo "Applied harvest docs/dioceses snapshot"
          fi
          if [ -f _harvest_docs/docs/manifest.json ]; then
            cp _harvest_docs/docs/manifest.json docs/manifest.json
            echo "Applied harvest docs/manifest.json"
          fi

      - name: Stage mega PDFs for OCR
        run: |
          set -euo pipefail
          STAGED="/tmp/ocr-bulletins/staged"
          RAW="/tmp/ocr-bulletins/raw"
          mkdir -p "${STAGED}" "${RAW}"
          shopt -s nullglob
          mapfile -d '' PDFS < <(find "${RAW}" -type f -name '*_mega_bulletin.pdf' -print0 2>/dev/null || true)
          for pdf in "${PDFS[@]}"; do
            [ -n "${pdf}" ] || continue
            name="$(basename "${pdf}")"
            [ -n "${name}" ] || continue
            dest="${STAGED}/${name}"
            if [ -f "${dest}" ]; then
              echo "Skipping duplicate artifact path (already staged): ${pdf}"
              continue
            fi
            cp "${pdf}" "${dest}"
            ls -lh "${dest}"
          done

          PAGES_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          for diocese in $(python -c "import json;print(' '.join(d['key'] for d in json.load(open('parishes/dioceses.json'))['dioceses']))"); do
            dest="${STAGED}/${diocese}_mega_bulletin.pdf"
            if [ -f "${dest}" ]; then
              continue
            fi
            url="${PAGES_BASE}/mega_pdf/${diocese}_mega_bulletin.pdf"
            echo "Trying GitHub Pages fallback for ${diocese}: ${url}"
            if curl -fsSL "${url}" -o "${dest}.tmp" && python3 -c "import sys; sig=open(sys.argv[1],'rb').read(5); sys.exit(0 if sig==b'%PDF-' else 1)" "${dest}.tmp"; then
              mv "${dest}.tmp" "${dest}"
              ls -lh "${dest}"
            else
              rm -f "${dest}.tmp"
              echo "Warning: no mega PDF for ${diocese} in artifacts or on Pages"
            fi
          done

          mapfile -d '' STAGED_PDFS < <(find "${STAGED}" -maxdepth 1 -type f -name '*_mega_bulletin.pdf' -print0)
          if [ ${#STAGED_PDFS[@]} -eq 0 ]; then
            echo "::error::No mega PDF files found (checked harvest artifacts and ${PAGES_BASE}/mega_pdf/)."
            find "${RAW}" -type f 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "Staged ${#STAGED_PDFS[@]} mega PDF(s) for OCR"
          mkdir -p docs/mega_pdf
          for pdf in "${STAGED_PDFS[@]}"; do
            [ -n "${pdf}" ] || continue
            cp "${pdf}" "docs/mega_pdf/$(basename "${pdf}")"
            ls -lh "docs/mega_pdf/$(basename "${pdf}")"
          done
          echo "Copied staged mega PDFs into docs/mega_pdf for Pages"

      - name: Generate OCR viewer pages
        id: ocr_generate
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TODAY="$(date -u +%Y-%m-%d)"
          STAGED="/tmp/ocr-bulletins/staged"
          PROCESSED=0
          FAILURES=0
          for diocese in $(python -c "import json;print(' '.join(d['key'] for d in json.load(open('parishes/dioceses.json'))['dioceses']))"); do
            pdf_path="${STAGED}/${diocese}_mega_bulletin.pdf"
            if [ ! -f "${pdf_path}" ]; then
              echo "Warning: PDF not found for ${diocese}, skipping"
              continue
            fi
            workdir="/tmp/ocr-bulletins/${diocese}"
            mkdir -p "${workdir}"
            ocr_html="${workdir}/bulletin-${TODAY}.html"
            echo "=== OCR ${diocese} ==="
            if ! (
              cd "${workdir}"
              python "${GITHUB_WORKSPACE}/ocr/convert_bulletin.py" "${pdf_path}" "${TODAY}"
            ); then
              echo "::warning::convert_bulletin failed for ${diocese}"
              FAILURES=$((FAILURES + 1))
              continue
            fi
            if ! python ocr/generate_bulletin_pages.py \
              --diocese "${diocese}" \
              --date "${TODAY}" \
              --pdf "${pdf_path}" \
              --ocr-html "${ocr_html}"; then
              echo "::warning::generate_bulletin_pages failed for ${diocese}"
              FAILURES=$((FAILURES + 1))
              continue
            fi
            PROCESSED=$((PROCESSED + 1))
            echo "OK: ${diocese}"
          done
          echo "processed=${PROCESSED}" >> "$GITHUB_OUTPUT"
          if [ "${PROCESSED}" -eq 0 ]; then
            echo "::error::OCR produced no diocese viewers — check API keys and harvest PDF artifacts."
            exit 1
          fi
          if [ "${FAILURES}" -gt 0 ]; then
            echo "::warning::OCR completed with ${FAILURES} diocese failure(s) — other dioceses still committed."
          fi

      - name: Rebuild diocese pages (embed OCR on Raphoe page)
        if: steps.ocr_generate.outputs.processed != '0'
        run: |
          set -euo pipefail
          if [ ! -f Bulletins/report.json ]; then
            echo "Warning: Bulletins/report.json missing — skipping site rebuild"
            exit 0
          fi
          python -c "from pathlib import Path; from harvester.site_builder import run; run(report_path=Path('Bulletins/report.json'), docs_dir=Path('docs'))"
          echo "Rebuilt docs/dioceses/*/index.html with latest OCR content"

      - name: Upload OCR docs snapshot
        if: steps.ocr_generate.outputs.processed != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ocr-docs-${{ github.run_id }}
          path: |
            docs/bulletins/
            docs/dioceses/
            docs/parishes/
            docs/mega_pdf/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated bulletin pages
        if: steps.ocr_generate.outputs.processed != '0'
        id: commit_ocr
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs Bulletins
          git add -f docs/mega_pdf/*_mega_bulletin.pdf docs/mega_pdf/*.pages.json docs/parishes 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::warning::OCR ran but nothing changed in docs/ — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update OCR bulletin viewers for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ OCR pushed on attempt ${attempt}"
              exit 0
            fi
            echo "⚠️  OCR push attempt ${attempt} failed; fetching and rebasing (autostash)…"
            git fetch origin main
            git rebase --autostash origin/main || {
              echo "❌ OCR rebase failed; aborting."
              git rebase --abort || true
              exit 1
            }
          done
          echo "❌ Could not push OCR after 5 attempts."
          exit 1

      - name: Warn if OCR git commit failed
        if: steps.ocr_generate.outputs.processed != '0' && steps.commit_ocr.outcome == 'failure'
        run: |
          echo "::warning::OCR viewers were generated but could not push to main — ocr-docs artifact was uploaded for Pages deploy."
