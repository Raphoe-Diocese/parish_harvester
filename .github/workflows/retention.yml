name: Retention — purge leftover old PDFs (archives disabled)

# Zip archives are off. This job only deletes leftover old individual PDFs
# and any unused Bulletins/archive/*.zip. Current-week PDFs and mega PDFs stay.
# Manual only — do not auto-run after harvest (that used to create zip copies).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — make no changes (true/false)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  issues: write

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run retention policy
        id: retention
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import json, os, sys
          from pathlib import Path
          from harvester.retention import apply_retention

          dry_run = os.getenv("DRY_RUN", "true").strip().lower() == "true"
          if dry_run:
              print("DRY RUN — no files will be changed.")

          report = apply_retention(Path("."), dry_run=dry_run)

          print("=== Retention report ===")
          print(f"Before: {report['before_bytes'] / 1024**3:.3f} GB")
          print(f"After:  {report['after_bytes'] / 1024**3:.3f} GB")
          print(f"Zipped: {len(report['zipped_files'])} file(s) (always 0 — archives disabled)")
          print(f"Deleted: {len(report['deleted_files'])} file(s)")
          if report['warnings']:
              print("Warnings:")
              for w in report['warnings']:
                  print(f"  {w}")

          with open("retention_report.json", "w") as fh:
              json.dump(report, fh, indent=2)

          if report['zipped_files']:
              print("ERROR: archives are disabled but files were zipped.")
              sys.exit(1)
          PYEOF

      - name: Commit purge changes
        if: github.event.inputs.dry_run != 'true' && steps.retention.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Bulletins/archive/ Bulletins/current/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No leftover files to purge — nothing to commit."
            exit 0
          fi
          BEFORE=$(python -c "import json; r=json.load(open('retention_report.json')); print(f\"{r['before_bytes']/1024**3:.3f}\")")
          AFTER=$(python -c "import json; r=json.load(open('retention_report.json')); print(f\"{r['after_bytes']/1024**3:.3f}\")")
          git commit -m "chore: retention — purge leftover old PDFs (${BEFORE} GB → ${AFTER} GB) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Could not push after 3 attempts."
          exit 1

      - name: Open storage cap warning issue
        if: steps.retention.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AFTER_GB=$(python -c "import json; r=json.load(open('retention_report.json')); print(f\"{r.get('after_bytes',0)/1024**3:.3f}\")" 2>/dev/null || echo "unknown")
          WARNINGS=$(python -c "
          import json
          r = json.load(open('retention_report.json'))
          print('\n'.join(f'- {w}' for w in r.get('warnings', [])))
          " 2>/dev/null || echo "- See retention_report.json for details")
          gh issue create \
            --title "Storage cap warning — repo is ${AFTER_GB} GB" \
            --body "## Storage cap warning

          The retention purge saw the repository at or over the 4 GB hard cap.

          Zip archives are **disabled**. Deleting files from the tree does **not** shrink GitHub quota until git history is rewritten. Do not force-push unless Frank asks.

          Official path if quota must drop: ask GitHub Support about removing bulky blobs, or a history rewrite with \`git filter-repo\` / BFG **only after an explicit yes**.

          ### Warnings
          ${WARNINGS}

          _This issue was auto-opened by the retention workflow._" \
            --label "storage" || true
