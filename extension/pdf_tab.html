<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bulletin</title>
  <style>
    html, body {
      margin: 0;
      background: #1a1a2e;
      color: #e8eef0;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #status {
      padding: 12px 16px;
      font-size: 0.95rem;
    }
    #status.err { color: #fecaca; }
    #pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 12px 24px;
    }
    canvas {
      background: #fff;
      max-width: 100%;
      height: auto;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <div id="status">Opening bulletin…</div>
  <div id="pages"></div>
  <script src="pdf.min.js"></script>
  <script src="pdf_tab.js"></script>
</body>
</html>
