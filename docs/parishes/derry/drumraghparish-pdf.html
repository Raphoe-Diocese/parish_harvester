<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drumragh PDF — 06/09/2026</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #525659;
      color: #1a1a2e;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 14px;
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid #d6ecea;
    }
    .top-left { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
    .back-link { font-weight: 700; color: #1a6b6b; text-decoration: none; font-size: 0.9rem; }
    .title-line { font-weight: 700; font-size: 0.9rem; color: #1a1a2e; }
    .download-link { font-weight: 700; color: #1a6b6b; text-decoration: none; font-size: 0.85rem; white-space: nowrap; }
    .pdf-standalone-shell {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #525659;
    }
    .pdf-frame { flex: 1 1 auto; border: 0; width: 100%; height: 100%; background: #525659; }
    body.embed-mode .top { display: none !important; }
    
    .pdf-inpage-viewer,
    .pdf-mobile-fallback {
      display: flex !important;
      flex-direction: column;
      height: 850px;
      min-height: 850px;
      max-height: 850px;
      overflow: hidden;
      flex: 1 1 auto;
      background: #3a3f42;
      color: #e8eeed;
      border: 1px solid #c9d4d3;
      box-sizing: border-box;
    }
    .pdf-inpage-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 8px 10px;
      background: #14524f;
      color: #fff;
      flex: 0 0 auto;
    }
    .pdf-inpage-backup { display: flex; gap: 8px; flex-wrap: wrap; }
    .pdf-inpage-backup a { color: #fff; font-weight: 700; font-size: 0.85rem; }
    .pdf-inpage-status { padding: 10px 12px; background: #1f3d3c; color: #d8f0ee; font-size: 0.9rem; }
    .pdf-inpage-pages {
      box-sizing: border-box;
      flex: 0 0 auto;
      height: 850px;
      min-height: 850px;
      max-height: 850px;
      overflow: auto;
      overflow-y: auto;
      overflow-x: hidden;
      /* Reserve the scrollbar gutter from the first paint. Without it the
         first page is sized to the full width, the vertical scrollbar then
         appears, and the page is suddenly ~16px too wide — a horizontal
         scrollbar under a strip of the bulletin. */
      scrollbar-gutter: stable;
      background: #525659;
      padding: 8px 0 16px;
    }
    #ocr-panel {
      box-sizing: border-box;
      height: 850px;
      min-height: 850px;
      max-height: 850px;
      overflow: auto;
      overflow-y: auto;
    }
    .pdf-inpage-page-slot {
      margin: 0 auto 10px;
      background: #3a3f42;
      min-height: 180px;
      max-width: 100%;
      position: relative;
    }
    .pdf-inpage-page-slot canvas { display: block; width: 100%; height: auto; background: #fff; }
    .pdf-first-preview { display: block; width: 100%; height: auto; background: #fff; }
    /* `overflow: hidden` clips a link annotation whose PDF rect lands off the
       page — one of those used to stretch the box's scrollWidth to 2988px. */
    .pdf-link-layer {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      overflow: hidden; pointer-events: none;
    }
    .pdf-annot-link {
      position: absolute; z-index: 2; pointer-events: auto;
      background: rgba(26, 107, 107, 0.08); border-radius: 2px;
    }
    .pdf-frame-wrap,
    .pdf-standalone-shell {
      display: flex;
      flex-direction: column;
      height: 850px;
      min-height: 850px;
      max-height: 850px;
      overflow: hidden;
      border: 1px solid #c9d4d3;
      box-sizing: border-box;
    }
    .pdf-frame-wrap iframe,
    .pdf-standalone-shell iframe.pdf-frame,
    body.is-native-pdf iframe.pdf-frame {
      display: none !important;
      height: 850px;
      min-height: 850px;
      max-height: 850px;
    }
    .pdf-frame-wrap.is-native-pdf,
    .pdf-standalone-shell.is-native-pdf,
    body.is-native-pdf .pdf-standalone-shell {
      display: flex;
      flex-direction: column;
      height: 850px !important;
      min-height: 850px !important;
      max-height: 850px !important;
      overflow: hidden !important;
      background: #3a3f42;
    }
    @media (max-width: 1024px) {
      .pdf-frame-wrap,
      .pdf-standalone-shell,
      .pdf-frame-wrap.is-native-pdf,
      .pdf-standalone-shell.is-native-pdf,
      body.is-native-pdf .pdf-standalone-shell {
        height: 450px !important;
        min-height: 450px !important;
        max-height: 450px !important;
        overflow: hidden !important;
        display: flex;
        flex-direction: column;
        background: #3a3f42;
      }
      .pdf-inpage-viewer,
      .pdf-mobile-fallback {
        height: 450px !important;
        min-height: 450px !important;
        max-height: 450px !important;
        overflow: hidden !important;
      }
      .pdf-inpage-pages,
      #ocr-panel,
      .pdf-frame-wrap iframe,
      .pdf-standalone-shell iframe.pdf-frame {
        height: 450px !important;
        min-height: 450px !important;
        max-height: 450px !important;
        overflow: auto !important;
        overflow-y: auto !important;
      }
      .pdf-inpage-pages { overflow-x: hidden !important; }
      .pdf-inpage-page-slot { max-width: 100%; }
      .pdf-frame-wrap iframe,
      .pdf-standalone-shell iframe.pdf-frame {
        display: none !important;
      }
    }

    @media (min-width: 701px) and (min-height: 501px) {
      .pdf-frame-wrap,
      .pdf-standalone-shell,
      .pdf-frame-wrap.is-native-pdf,
      .pdf-standalone-shell.is-native-pdf,
      body.is-native-pdf .pdf-standalone-shell,
      .pdf-inpage-viewer,
      .pdf-mobile-fallback {
        height: 850px !important;
        min-height: 850px !important;
        max-height: 850px !important;
        overflow: hidden !important;
      }
      .pdf-inpage-pages,
      #ocr-panel,
      .pdf-frame-wrap iframe,
      .pdf-standalone-shell iframe.pdf-frame {
        height: 850px !important;
        min-height: 850px !important;
        max-height: 850px !important;
        overflow: auto !important;
        overflow-y: auto !important;
      }
      /* `overflow: auto` above resets both axes, so re-hide the horizontal one:
         a single stray PDF link annotation off the right edge of a page used to
         give the whole box a horizontal scrollbar. */
      .pdf-inpage-pages { overflow-x: hidden !important; }
      /* Nothing to enlarge — the box is already the locked 850px. */
      .az-expand { display: none; }
    }

    body.is-native-pdf { background: #3a3f42; }
    body.is-native-pdf .pdf-standalone-shell { background: #3a3f42; }
  </style>
  <script src="/assets/pdf-inpage-viewer.js?v=20260901h" defer></script>

      <span class="title-line">DRUMRAGH · 06/09/2026</span>
    </div>

  <div class="pdf-standalone-shell">

            <div class="pdf-inpage-backup">
              <a class="pdf-open-newtab" href="drumraghparish.pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
              <a class="pdf-force-download" href="drumraghparish.pdf" download="drumraghparish.pdf">Download</a>

        </div>
  </div>
  <script>
    (function () {
      try {
        if (new URLSearchParams(window.location.search).get('embed') === '1') {
          document.body.classList.add('embed-mode');
        }
      } catch (e) {}
    })();
    
    (function () {
      function activateWrap(wrap) {
        if (!wrap) return;
        wrap.classList.add('is-native-pdf');
        var iframe = wrap.querySelector('iframe');
        if (iframe) {
          iframe.setAttribute('hidden', '');
          try { iframe.removeAttribute('src'); } catch (e) {}
        }
      }

      document.querySelectorAll('.pdf-frame-wrap').forEach(activateWrap);

      var standalone = document.querySelector('iframe.pdf-frame');
      if (standalone && !standalone.closest('.pdf-frame-wrap')) {
        document.body.classList.add('is-native-pdf');
        standalone.setAttribute('hidden', '');
        try { standalone.removeAttribute('src'); } catch (e) {}
      }

      if (!document.querySelector('script[src="/assets/pdf-inpage-viewer.js?v=20260901h"]')) {
        var s = document.createElement('script');
        s.src = '/assets/pdf-inpage-viewer.js?v=20260901h';
        s.defer = true;
        document.head.appendChild(s);
      }
    })();

  </script>
