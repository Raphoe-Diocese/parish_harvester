<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>${page_title}</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #ffffff;
      --panel: #f8fafc;
      --text: #222222;
      --muted: #666666;
      --border: #e5e7eb;
      --accent: #1e3a5f;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      line-height: 1.5;
      overflow-x: hidden;
    }
    .page {
      max-width: min(1280px, 100%);
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    .back-link {
      display: inline-block;
      margin: 0 0 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    header.page-head {
      margin: 0 0 16px;
      padding: 0 0 12px;
      border-bottom: 1px solid var(--border);
    }
    header.page-head h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .view-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .view-switch button {
      border: 0;
      background: transparent;
      padding: 0;
      font: inherit;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .view-switch button:hover,
    .view-switch button.is-active { color: var(--accent); }
    .view-switch button.is-active { text-decoration: underline; }
    .view-switch .sep { color: var(--border); font-weight: 400; }
    .panel-section { margin: 0 0 28px; }
    .panel-section[hidden] { display: none !important; }
    .section-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 16px;
      margin: 0 0 10px;
    }
    .section-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
    }
    .section-link {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .section-link:hover { text-decoration: underline; }
    .viewer-shell {
      width: 100%;
      height: 85vh;
      min-height: 850px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
    }
    .viewer-shell.pdf-shell { background: #fafafa; }
    .viewer-shell.ocr-shell {
      background: var(--panel);
      padding: 10px;
    }
    .viewer-shell iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
      border-radius: 6px;
    }
    .ocr-shell iframe {
      border: 1px solid var(--border);
    }
    .disclaimer {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .parish-section { margin: 0 0 8px; }
    .parish-accordion {
      border-top: 1px solid var(--border);
      padding-top: 4px;
    }
    .parish-accordion-toggle {
      list-style: none;
      cursor: pointer;
      padding: 12px 0;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent);
    }
    .parish-accordion-toggle::-webkit-details-marker { display: none; }
    .parish-accordion-toggle::before {
      content: "▸ ";
      color: var(--muted);
    }
    .parish-accordion[open] .parish-accordion-toggle::before { content: "▾ "; }
    .parish-link-grid {
      list-style: none;
      margin: 0;
      padding: 0 0 8px;
      columns: 3;
      column-gap: 28px;
    }
    .parish-link-grid li { margin: 0 0 8px; break-inside: avoid; }
    .parish-link-grid a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .parish-link-grid a:hover { text-decoration: underline; }
    .site-footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      padding: 16px 20px;
      max-width: min(1280px, 100%);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.88rem;
    }
    .site-footer a { color: var(--accent); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
    @media (max-width: 900px) {
      .viewer-shell {
        height: 75vh;
        min-height: 75vh;
      }
      .parish-link-grid { columns: 2; }
    }
    @media (max-width: 520px) {
      .page { padding: 16px 12px 32px; }
      header.page-head h1 { font-size: 1.2rem; }
      .parish-link-grid { columns: 1; }
      .ocr-shell { padding: 6px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <button type="button" class="back-link" id="back-btn">← Back</button>
    <header class="page-head">
      <h1>${headline}</h1>
      <nav class="view-switch" aria-label="Bulletin view">
        <button type="button" class="is-active" data-panel="original-pdf">Original PDF</button>
        <span class="sep" aria-hidden="true">|</span>
        <button type="button" data-panel="text-bulletin">Text Bulletin</button>
      </nav>
    </header>

    <section class="panel-section" id="original-pdf" aria-label="Original PDF">
      <div class="section-meta">
        <h2 class="section-title">Original PDF</h2>
        <a class="section-link" href="${mega_pdf_url}" target="_blank" rel="noopener noreferrer">Open original PDF</a>
      </div>
      <div class="viewer-shell pdf-shell">
        <iframe src="${mega_pdf_url}" title="Collated bulletin PDF preview"></iframe>
      </div>
    </section>

    <section class="panel-section" id="text-bulletin" aria-label="Text bulletin" hidden>
      <div class="section-meta">
        <h2 class="section-title">Text Bulletin</h2>
        <a class="section-link" href="${ocr_standalone_url}" target="_blank" rel="noopener noreferrer">Open full text</a>
      </div>
      <div class="viewer-shell ocr-shell">
        <iframe
          src="${ocr_embed_url}"
          title="${ocr_iframe_title}"
          width="100%"
          loading="lazy"
        ></iframe>
      </div>
    </section>

    <p class="disclaimer">Auto-generated text may contain errors — check the original PDF when accuracy matters. Irish and bilingual wording is kept as printed.</p>

    <section class="parish-section">
      ${parish_accordion_html}
    </section>
  </main>

  <footer class="site-footer">
    <span>© ${year} Parish Press</span>
    <a href="${issues_url}" target="_blank" rel="noopener noreferrer">Report a problem</a>
  </footer>

  <script>
    (function () {
      var backBtn = document.getElementById('back-btn');
      if (backBtn) {
        backBtn.addEventListener('click', function () {
          if (window.history.length > 1) window.history.back();
          else window.location.href = '../../index.html';
        });
      }
      var buttons = document.querySelectorAll('.view-switch button[data-panel]');
      var panels = {
        'original-pdf': document.getElementById('original-pdf'),
        'text-bulletin': document.getElementById('text-bulletin')
      };
      function showPanel(id) {
        Object.keys(panels).forEach(function (key) {
          if (!panels[key]) return;
          panels[key].hidden = key !== id;
        });
        buttons.forEach(function (btn) {
          btn.classList.toggle('is-active', btn.getAttribute('data-panel') === id);
        });
      }
      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          showPanel(btn.getAttribute('data-panel'));
        });
      });
      showPanel('original-pdf');
    })();
  </script>
</body>
</html>
