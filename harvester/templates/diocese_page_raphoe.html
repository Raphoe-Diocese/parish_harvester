<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>${page_title}</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #ffffff;
      --text: #222222;
      --muted: #666666;
      --border: #e5e7eb;
      --accent: #1e3a5f;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      line-height: 1.5;
    }
    .page {
      max-width: min(1280px, 100%);
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    .back-link {
      display: inline-block;
      margin: 0 0 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    header.page-head {
      margin: 0 0 16px;
      padding: 0 0 12px;
      border-bottom: 1px solid var(--border);
    }
    header.page-head h1 {
      margin: 0 0 10px;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .view-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .view-switch a {
      color: var(--muted);
      text-decoration: none;
    }
    .view-switch a:hover,
    .view-switch a.is-active { color: var(--accent); }
    .view-switch a.is-active { text-decoration: underline; }
    .view-switch .sep { color: var(--border); font-weight: 400; }
    .section { margin: 0 0 32px; }
    .section-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 16px;
      margin: 0 0 10px;
    }
    .section-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
    }
    .section-link {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .section-link:hover { text-decoration: underline; }
    .ocr-embed {
      width: 100%;
      height: max(80vh, calc(100vh - 180px));
      min-height: 80vh;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      display: block;
    }
    .pdf-preview {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
      height: max(80vh, 900px);
      min-height: 900px;
    }
    .pdf-preview iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .disclaimer {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .parish-section { margin: 0 0 8px; }
    .parish-accordion {
      border-top: 1px solid var(--border);
      padding-top: 4px;
    }
    .parish-accordion-toggle {
      list-style: none;
      cursor: pointer;
      padding: 12px 0;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent);
    }
    .parish-accordion-toggle::-webkit-details-marker { display: none; }
    .parish-accordion-toggle::before {
      content: "▸ ";
      color: var(--muted);
    }
    .parish-accordion[open] .parish-accordion-toggle::before { content: "▾ "; }
    .parish-link-grid {
      list-style: none;
      margin: 0;
      padding: 0 0 8px;
      columns: 3;
      column-gap: 28px;
    }
    .parish-link-grid li { margin: 0 0 8px; break-inside: avoid; }
    .parish-link-grid a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .parish-link-grid a:hover { text-decoration: underline; }
    .site-footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      padding: 16px 20px;
      max-width: min(1280px, 100%);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.88rem;
    }
    .site-footer a { color: var(--accent); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
    @media (max-width: 800px) {
      .parish-link-grid { columns: 2; }
      .pdf-preview { min-height: 70vh; height: 70vh; }
      .ocr-embed { min-height: 70vh; height: 70vh; }
    }
    @media (max-width: 520px) {
      .page { padding: 16px 12px 32px; }
      header.page-head h1 { font-size: 1.25rem; }
      .parish-link-grid { columns: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <button type="button" class="back-link" id="back-btn">← Back</button>
    <header class="page-head">
      <h1>${headline}</h1>
      <nav class="view-switch" aria-label="Bulletin view">
        <a class="is-active" href="#text-bulletin">Text Bulletin</a>
        <span class="sep" aria-hidden="true">|</span>
        <a href="#original-pdf">Original PDF</a>
      </nav>
    </header>

    <section class="section" id="text-bulletin" aria-label="Text bulletin">
      <div class="section-meta">
        <h2 class="section-title">Text Bulletin</h2>
        <a class="section-link" href="${ocr_standalone_url}" target="_blank" rel="noopener noreferrer">Open full text</a>
      </div>
      <iframe
        class="ocr-embed"
        src="${ocr_embed_url}"
        title="${ocr_iframe_title}"
        width="100%"
        loading="lazy"
      ></iframe>
    </section>

    <p class="disclaimer">Auto-generated text may contain errors — check the original PDF when accuracy matters.</p>

    <section class="section" id="original-pdf" aria-label="Original PDF">
      <div class="section-meta">
        <h2 class="section-title">Original PDF</h2>
        <a class="section-link" href="${mega_pdf_url}" target="_blank" rel="noopener noreferrer">Open original PDF</a>
      </div>
      <div class="pdf-preview">
        <iframe src="${mega_pdf_url}" title="Collated bulletin PDF preview"></iframe>
      </div>
    </section>

    <section class="parish-section">
      ${parish_accordion_html}
    </section>
  </main>

  <footer class="site-footer">
    <span>© ${year} Parish Press</span>
    <a href="${issues_url}" target="_blank" rel="noopener noreferrer">Report a problem</a>
  </footer>

  <script>
    (function () {
      var backBtn = document.getElementById('back-btn');
      if (backBtn) {
        backBtn.addEventListener('click', function () {
          if (window.history.length > 1) window.history.back();
          else window.location.href = '../../index.html';
        });
      }
      document.querySelectorAll('.view-switch a[href^="#"]').forEach(function (link) {
        link.addEventListener('click', function () {
          document.querySelectorAll('.view-switch a').forEach(function (a) {
            a.classList.toggle('is-active', a === link);
          });
        });
      });
    })();
  </script>
</body>
</html>
