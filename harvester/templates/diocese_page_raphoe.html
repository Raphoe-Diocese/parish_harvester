<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>${page_title}</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #ffffff;
      --text: #222222;
      --muted: #666666;
      --border: #e5e7eb;
      --accent: #1e3a5f;
    }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      line-height: 1.5;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .back-link {
      display: inline-block;
      margin: 0 0 12px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    header.page-head {
      margin: 0 0 16px;
      padding: 0 0 16px;
      border-bottom: 1px solid var(--border);
    }
    header.page-head h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .ocr-embed-link {
      display: inline-block;
      margin: 0 0 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .ocr-embed-link:hover { text-decoration: underline; }
    .ocr-embed {
      width: 100%;
      height: 75vh;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      display: block;
      margin: 0 0 28px;
    }

    .section { margin: 0 0 36px; }
    .section-title {
      margin: 0 0 12px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
    }
    .section-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 16px;
      margin: 0 0 12px;
    }
    .section-meta .section-title { margin: 0; }
    .section-link {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .section-link:hover { text-decoration: underline; }

    .ocr-search-bar { margin: 0 0 10px; position: relative; }
    .ocr-search-bar input {
      width: 100%;
      min-height: 44px;
      padding: 10px 40px 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      background: #fff;
    }
    .ocr-search-bar input:focus { border-color: var(--accent); }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .search-clear[hidden] { display: none; }
    .ocr-search-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 16px;
      flex-wrap: wrap;
    }
    .ocr-search-tools[hidden] { display: none; }
    .ocr-search-tools button {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--accent);
      font: inherit;
      font-weight: 600;
      min-height: 36px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .ocr-search-tools button:disabled {
      color: #999;
      border-color: var(--border);
      cursor: not-allowed;
    }
    .match-count { color: var(--muted); font-size: 0.9rem; font-weight: 600; }

    .ocr-reader {
      max-width: 960px;
      margin: 0;
    }
    .ocr-body {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--text);
    }
    .ocr-body h1, .ocr-body h2, .ocr-body h3, .ocr-body h4 {
      color: var(--accent);
      margin: 1.1em 0 0.4em;
      line-height: 1.3;
      font-weight: 600;
    }
    .ocr-body h2.b-title {
      font-size: 1.15em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.2em;
    }
    .ocr-body h3.b-head { font-size: 1.05em; }
    .ocr-body h4.b-sub { font-size: 1em; color: #334155; }
    .ocr-body .page-label { display: none !important; }
    .ocr-body p { margin: 0 0 0.65em; }
    .ocr-body hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
    .ocr-body table.b-table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.75em 0;
      font-size: 0.95em;
    }
    .ocr-body table.b-table td,
    .ocr-body table.b-table th {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .ocr-body table.b-table th {
      background: #f8fafc;
      color: var(--accent);
      font-weight: 600;
    }
    .ocr-pre {
      margin: 0;
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.65;
    }
    #ocr-text mark { background: #fef3c7; padding: 0 2px; border-radius: 2px; }
    #ocr-text mark.search-active { background: #fde68a; outline: 1px solid var(--accent); }

    .parish-block {
      margin: 0 0 0.85rem;
      padding: 0;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      border-radius: 0;
    }
    .parish-block.parish-odd { background: transparent; }
    .parish-block > summary.parish-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 14px;
      margin: 0;
      padding: 0.7rem 0;
      border: 0;
      cursor: pointer;
      list-style: none;
    }
    .parish-block > summary.parish-head::-webkit-details-marker { display: none; }
    .parish-name {
      margin: 0 !important;
      font-size: 1.08rem !important;
      font-family: inherit !important;
      font-weight: 600 !important;
      color: var(--accent) !important;
      border: 0 !important;
      padding: 0 !important;
    }
    .parish-name::before {
      content: "";
      display: inline-block;
      width: 0.45em;
      height: 0.45em;
      margin-right: 0.45em;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: rotate(-45deg);
      vertical-align: 0.15em;
    }
    .parish-block[open] .parish-name::before {
      transform: rotate(45deg);
      vertical-align: 0.35em;
    }
    .parish-source {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      text-decoration: none;
      color: var(--accent);
    }
    .parish-source:hover { text-decoration: underline; }
    .parish-source.muted { color: var(--muted); font-weight: 500; }
    .parish-body { padding: 0 0 0.85rem; }
    .parish-empty {
      margin: 0;
      font-size: 0.92rem;
      color: var(--muted);
      font-style: normal;
    }

    .pdf-preview {
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      background: #fafafa;
      height: 55vh;
      min-height: 360px;
    }
    .pdf-preview iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .disclaimer {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .parish-section { margin: 0 0 8px; }
    .parish-accordion {
      border-top: 1px solid var(--border);
      padding-top: 4px;
    }
    .parish-accordion-toggle {
      list-style: none;
      cursor: pointer;
      padding: 12px 0;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent);
    }
    .parish-accordion-toggle::-webkit-details-marker { display: none; }
    .parish-accordion-toggle::before {
      content: "▸ ";
      color: var(--muted);
    }
    .parish-accordion[open] .parish-accordion-toggle::before { content: "▾ "; }
    .parish-link-grid {
      list-style: none;
      margin: 0;
      padding: 0 0 8px;
      columns: 3;
      column-gap: 28px;
    }
    .parish-link-grid li { margin: 0 0 8px; break-inside: avoid; }
    .parish-link-grid a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .parish-link-grid a:hover { text-decoration: underline; }

    .site-footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      padding: 16px 20px;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.88rem;
    }
    .site-footer a { color: var(--accent); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }

    @media (max-width: 800px) {
      .parish-link-grid { columns: 2; }
      .pdf-preview { height: 50vh; min-height: 280px; }
    }
    @media (max-width: 520px) {
      .page { padding: 20px 14px 32px; }
      header.page-head h1 { font-size: 1.3rem; }
      .parish-link-grid { columns: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <button type="button" class="back-link" id="back-btn">← Back</button>
    <header class="page-head">
      <h1>${headline}</h1>
    </header>

    <a class="ocr-embed-link" href="${ocr_standalone_url}" target="_blank" rel="noopener noreferrer">Open full text in new tab</a>
    <iframe
      class="ocr-embed"
      src="${ocr_standalone_url}"
      title="${ocr_iframe_title}"
      width="100%"
      height="75vh"
      loading="lazy"
    ></iframe>

    <p class="disclaimer">Auto-generated text may contain errors — check the original PDF when accuracy matters.</p>

    <section class="section" aria-label="Original PDF preview">
      <div class="section-meta">
        <h2 class="section-title">Original PDF</h2>
        <a class="section-link" href="${mega_pdf_url}" target="_blank" rel="noopener noreferrer">Open original PDF</a>
      </div>
      <div class="pdf-preview">
        <iframe src="${mega_pdf_url}" title="Collated bulletin PDF preview"></iframe>
      </div>
    </section>

    <section class="parish-section">
      ${parish_accordion_html}
    </section>
  </main>

  <footer class="site-footer">
    <span>© ${year} Parish Press</span>
    <a href="${issues_url}" target="_blank" rel="noopener noreferrer">Report a problem</a>
  </footer>

  <script>
    (function () {
      var backBtn = document.getElementById('back-btn');
      if (backBtn) {
        backBtn.addEventListener('click', function () {
          if (window.history.length > 1) window.history.back();
          else window.location.href = '../../index.html';
        });
      }
    })();
  </script>
</body>
</html>
